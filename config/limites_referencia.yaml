# Normalização 0–100 dos indicadores do Índice de Saúde Municipal
# Versão: v0.4.0
#
# REGRA INEGOCIÁVEL: proibido inventar limites ou metas. Por isso, enquanto as metas oficiais
# (MS/PNI/OMS) não forem confirmadas em documento primário e registradas em docs/PENDENCIAS.md,
# a normalização é RELATIVA: percentis da distribuição observada entre os municípios brasileiros.
#   nota = 100 * clip((valor - pior) / (melhor - pior), 0, 1)
#   pior/melhor = percentis (p_inf, p_sup) do valor da janela vigente, em TODOS os municípios com dado.
# Os limites efetivamente usados ficam CONGELADOS por versão metodológica em
# config/limites_calculados.json (recalculados somente em nova versão — ver DEC-009/DEC-013).
#
# Interpretação: a nota expressa a POSIÇÃO RELATIVA no Brasil, não o cumprimento de uma meta sanitária.
# Quando uma meta oficial for validada, ela substituirá os percentis em nova versão (PEND-033).

versao_limites: "v0.4.0"
status_geral: "RELATIVO_POR_PERCENTIS"
pendencia_id: "PEND-033"
metodo_normalizacao: "percentis"
percentil_inferior: 5
percentil_superior: 95
# Pares (p_inf, p_sup) usados na ANÁLISE DE SENSIBILIDADE da faixa de posição plausível
sensibilidade_percentis:
  - [1, 99]
  - [5, 95]
  - [10, 90]

indicadores:
  D1.1:
    nome: "Mortalidade infantil (suavizada)"
    coluna: "tmi_bayes"
    sentido: "menor_melhor"
    dimensao: "D1"
    meta_oficial_confirmada: null   # A_VALIDAR: ODS 3.2 define metas para neonatal/<5 anos, não para infantil
  D1.2:
    nome: "Razão de mortalidade materna (suavizada)"
    coluna: "rmm_bayes"
    sentido: "menor_melhor"
    dimensao: "D1"
    meta_oficial_confirmada: null   # A_VALIDAR: ODS 3.1 (<70/100 mil NV) a confirmar em documento primário
  D2.2:
    nome: "Pré-natal com 7+ consultas"
    coluna: "pre7_pct"
    sentido: "maior_melhor"
    dimensao: "D2"
    meta_oficial_confirmada: null   # A_VALIDAR: parâmetro oficial vigente (Rede Cegonha / PNAB)
  D2.3:
    nome: "Cobertura vacinal poliomielite"
    coluna: "cob_vac_polio"
    sentido: "maior_melhor"
    dimensao: "D2"
    meta_oficial_confirmada: null   # A_VALIDAR: meta PNI (a confirmar em documento oficial do CGPNI)
  D3.1:
    nome: "Leitos SUS por 100 mil hab."
    coluna: "tx_leito_sus"
    sentido: "maior_melhor"
    dimensao: "D3"
    meta_oficial_confirmada: null   # A_VALIDAR
  D3.2:
    nome: "Médicos por 1.000 hab."
    coluna: "tx_med"
    sentido: "maior_melhor"
    dimensao: "D3"
    meta_oficial_confirmada: null   # A_VALIDAR
  D3.3:
    nome: "Cobertura da Estratégia Saúde da Família"
    coluna: "cob_esf"
    sentido: "maior_melhor"
    dimensao: "D3"
    meta_oficial_confirmada: null   # A_VALIDAR (teto natural 100%)

# Indicadores ainda sem pipeline (fora do cálculo; permanecem A_VALIDAR)
pendentes_sem_calculo:
  D1.3: "Mortalidade prematura por DCNT — exige denominador populacional por faixa etária (30–69 anos)"
  D1.4: "Mortalidade por causas evitáveis — exige lista de evitabilidade oficial validada"
  D2.1: "ICSAP — exige microdados SIH/SUS (RD) e lista oficial de CID (Portaria SAS/MS 221/2008)"
  D2.4: "Desempenho APS — fora até consolidação"
  D3.4: "Internações no próprio município — informativo"
