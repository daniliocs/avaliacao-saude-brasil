    sentido: "menor_melhor"
    unidade: "óbitos por 100.000 NV"
    fontes:
      - sim_do
      - sinasc_nv
    janela_anos: 5 # Quinquênio 2019-2023 por raridade de evento
    nivel_agregacao: "residencia"
    entra_na_nota: false # Informativo em nível municipal (93% dos municípios <5 óbitos no quinquênio - PEND-038)
    requer_suavizacao_bayesiana: true
    calcula_ic_poisson: true
    pendencia_id: "PEND-038"

