    dimensao: D1
    nome: "Mortalidade Infantil"
    descricao: "Taxa de mortalidade infantil (óbitos em menores de 1 ano por 1.000 nascidos vivos)"
    sentido: "menor_melhor"
    unidade: "óbitos por 1.000 NV"
    fontes:
      - sim_do
      - sinasc_nv
    janela_anos: 3 # A_VALIDAR: 3 a 5 anos
    nivel_agregacao: "residencia"
    entra_na_nota: true
    requer_suavizacao_bayesiana: true
    calcula_ic_poisson: true
    pendencia_id: "PEND-028"

