  - id: D1.1
    dimensao: D1
    nome: "Mortalidade Infantil"
    descricao: "Taxa de mortalidade infantil (óbitos em menores de 1 ano por 1.000 nascidos vivos — janela trienal 2021–2023)"
    sentido: "menor_melhor"
    unidade: "óbitos por 1.000 NV"
    fontes:
      - sim_do
      - sinasc_nv
    janela_anos: 3 # Triênio 2021-2023 (PEND-035)
    nivel_agregacao: "residencia"
    entra_na_nota: true
    requer_suavizacao_bayesiana: true
    calcula_ic_poisson: true
    pendencia_id: "PEND-035"

  - id: D1.2
    dimensao: D1
    nome: "Razão de Mortalidade Materna"
