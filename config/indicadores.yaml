# Catálogo Paramétrico de Indicadores do Índice de Saúde Municipal
# Versão: v0.5.0-draft
# Regra: Nenhum dado inventado. Campos não confirmados devem ser parametrizados como "A_VALIDAR" ou null.

indicadores:
