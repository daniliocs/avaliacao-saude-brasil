# Configuração de Esquemas de Ponderação do Índice de Saúde Municipal
# Versão: v0.4.0
# Status: A_DECIDIR (Seção 7 da especificação e PEND-034)
#
# Apenas indicadores COM PIPELINE ativo recebem peso > 0. Os demais permanecem em 0 até validação.
# Dentro de cada dimensão, o peso é renormalizado entre os componentes disponíveis do município.

versao_esquema: "v0.4.0"
status_decisao: "A_DECIDIR"
pendencia_id: "PEND-034"

esquema_padrao: "pesos_iguais"

# Nº mínimo de componentes disponíveis para que a dimensão tenha nota (sem imputação)
min_componentes_por_dimensao:
  D1: 1
  D2: 1
  D3: 2

# Componentes que entram na nota têm peso > 0 em esquemas.pesos_iguais.indicadores

esquemas:
  pesos_iguais:
    descricao: "Pesos equivalentes entre D1, D2 e D3 (33,33% cada) e entre indicadores ativos de cada dimensão"
    dimensoes:
      D1: 0.3333333333333333
      D2: 0.3333333333333333
      D3: 0.3333333333333333
      D4: 0.0        # Contexto: FORA DA NOTA (DEC-001)
      PRIVADA: 0.0   # Camada Privada: FORA DA NOTA (DEC-001)
    indicadores:
      D1.1: 1.0
      D1.2: 0.0   # INFORMATIVO (PEND-038): evento raro; após suavização reflete sobretudo a UF. Exibido na ficha, fora da nota.
      D1.3: 0.0   # sem pipeline (PEND)
      D1.4: 0.0   # sem pipeline (PEND)
      D2.1: 0.0   # sem pipeline (ICSAP/SIH — PEND)
      D2.2: 0.5
      D2.3: 0.5
      D2.4: 0.0
      D3.1: 0.3333333333333333
      D3.2: 0.3333333333333333
      D3.3: 0.3333333333333333
      D3.4: 0.0

  # Esquemas alternativos para a Análise de Sensibilidade (faixa de posição plausível)
  foco_resultados:
    descricao: "Maior ênfase em Resultados (D1=50%, D2=30%, D3=20%)"
    dimensoes: {D1: 0.50, D2: 0.30, D3: 0.20, D4: 0.0, PRIVADA: 0.0}

  foco_atencao_primaria:
    descricao: "Maior ênfase na Atenção Primária (D1=30%, D2=50%, D3=20%)"
    dimensoes: {D1: 0.30, D2: 0.50, D3: 0.20, D4: 0.0, PRIVADA: 0.0}

  pca_estatistico:
    descricao: "Pesos derivados empiricamente por PCA"
    status: "A_VALIDAR"
    dimensoes: null
    indicadores: null
